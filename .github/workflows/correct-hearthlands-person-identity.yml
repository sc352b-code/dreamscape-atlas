name: Correct Hearthlands person identity boundary

on:
  push:
    branches: [family-home-pilot]
    paths:
      - '.github/workflows/correct-hearthlands-person-identity.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: family-home-pilot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct public person ontology without exposing private labels
        run: |
          python - <<'PY'
          import json, pathlib
          base=pathlib.Path('worlds/reference-world/territories/hearthlands')
          mapping={f'recurring-figure-{i:02d}':f'person-{i:02d}' for i in range(1,16)}

          def rewrite_ref(value):
              if not isinstance(value,str): return value
              for old,new in mapping.items(): value=value.replace(old,new)
              return value

          def walk(obj):
              if isinstance(obj,dict): return {rewrite_ref(k):walk(v) for k,v in obj.items()}
              if isinstance(obj,list): return [walk(v) for v in obj]
              return rewrite_ref(obj)

          for path in [base/'symbols.json',base/'territory-manifest.json']:
              data=walk(json.load(open(path)))
              symbols=data if isinstance(data,list) else data['symbols']
              for s in symbols:
                  if s.get('id','').startswith('person-'):
                      s['name']=s['id']
                      s['semanticIdentity']={
                          'kind':'person',
                          'labelSource':'private-profile',
                          'labelResolvedInPublicRuntime':False,
                          'userFacingLabelPolicy':'resolve-private-semantic-label-before-display'
                      }
                      s['interaction']['hoverable']=False
                      s['interaction']['clickable']=False
                      s['interaction']['hoverLabel']=False
              open(path,'w').write(json.dumps(data,indent=2)+'\n')

          p=base/'tarot/tarot-cards.json'
          cards=walk(json.load(open(p)))
          for key,card in cards.items():
              if '/person-' in key:
                  card['title']='Private semantic label required'
                  card['interpretation']='This person symbol is intentionally withheld from the public runtime until its corpus-supported semantic label is resolved from the private profile layer.'
                  card['semanticIdentityStatus']='private-label-required'
          open(p,'w').write(json.dumps(cards,indent=2)+'\n')

          p=base/'validation/image-location-ledger.json'
          ledger=walk(json.load(open(p)))
          for e in ledger['entries']:
              if e.get('kind')=='symbol' and e.get('id','').startswith('person-'):
                  e['label']=e['id']
                  e['registrationStatus']='identity-resolution-required'
                  e['paintedObject']=None; e['x']=None; e['y']=None; e['hitArea']=None; e['activeFromZoom']=None
                  e['auditConfidence']='paused'
                  e['correctionReason']='Person artwork/registration is paused until the private corpus-supported semantic identity is deliberately represented; arbitrary human figures must not be assigned.'
          people=sum(1 for e in ledger['entries'] if e.get('id','').startswith('person-'))
          ledger['summary']['personSymbolsAwaitingPrivateIdentity']=people
          ledger['summary']['symbolsNeedingArtCorrection']=sum(1 for e in ledger['entries'] if e.get('kind')=='symbol' and e.get('registrationStatus')=='needs-art-correction')
          ledger['principles']={
              'personIdentity':'Semantic person labels come from the private corpus/profile layer. Public technical IDs are storage identifiers only.',
              'artwork':'No arbitrary painted human may stand in for a person symbol whose semantic identity has not been intentionally resolved.'
          }
          open(p,'w').write(json.dumps(ledger,indent=2)+'\n')

          p=base/'validation/artwork-coverage.json'
          coverage=walk(json.load(open(p)))
          open(p,'w').write(json.dumps(coverage,indent=2)+'\n')

          checked=[base/'symbols.json',base/'territory-manifest.json',base/'tarot/tarot-cards.json',base/'validation/image-location-ledger.json',base/'validation/artwork-coverage.json']
          for path in checked:
              text=path.read_text()
              assert 'Recurring Figure' not in text
              assert 'recurring-figure-' not in text
          PY

          git config user.name 'dreamscape-engine-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add worlds/reference-world/territories/hearthlands/
          git commit -m 'Complete Hearthlands public person identity cleanup'
          git pull --rebase origin family-home-pilot
          git push origin HEAD:family-home-pilot
