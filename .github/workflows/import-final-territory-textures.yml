name: Import final territory textures

on:
  push:
    branches: [family-home-pilot]
    paths:
      - '.github/workflows/import-final-territory-textures.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-final-territories:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SHARE_ID: BDfWLsXzZRkz
      API_BASE: https://api.firestorage.ai/dev/file
      ZIP_SHA256: 0644a77863238ed099156f42349b10b0fa8565c8137661287699b1498e5a39a2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: family-home-pilot
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact final texture bundle
        shell: bash
        run: |
          set -euo pipefail
          LIST_JSON="$(curl -L --max-time 20 --fail --silent --show-error "$API_BASE/shares/$SHARE_ID/files?maxResults=1000")"
          FILE_ID="$(printf '%s' "$LIST_JSON" | jq -r '.files[] | select(.fileName == "dreamscape-final-territory-textures.zip") | .fileId' | head -1)"
          test -n "$FILE_ID" && test "$FILE_ID" != "null"
          DOWNLOAD_JSON="$(curl -L --max-time 20 --fail --silent --show-error -X POST "$API_BASE/shares/$SHARE_ID/files/$FILE_ID/download")"
          DOWNLOAD_URL="$(printf '%s' "$DOWNLOAD_JSON" | jq -r '.downloadUrl')"
          test -n "$DOWNLOAD_URL" && test "$DOWNLOAD_URL" != "null"
          curl -L --max-time 120 --fail --silent --show-error "$DOWNLOAD_URL" -o /tmp/final-territories.zip
          echo "$ZIP_SHA256  /tmp/final-territories.zip" | sha256sum -c -
      - name: Verify and install five approved final textures
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/final-territories && mkdir -p /tmp/final-territories
          unzip -q /tmp/final-territories.zip -d /tmp/final-territories
          echo 'f82fa882827a2313df3c65960634d94d9dce2490a34926e9ddbd67d1a2f204e6  /tmp/final-territories/hearthlands-final.png' | sha256sum -c -
          echo '15fba2314fe53f12ed3078b24163ad5be3b0398cb811b1fd3f560ceafb39abb0  /tmp/final-territories/roadlands-final.png' | sha256sum -c -
          echo 'a43e24323ed7cd949f080648868c9dfa5934a3ba81b8f5e374e628bb94d91021  /tmp/final-territories/littoral-final.png' | sha256sum -c -
          echo '3e1d4577ec4b42d678d9fdc1846cd365cfabb875a32945043842d7707f53d4e8  /tmp/final-territories/institutional-final.png' | sha256sum -c -
          echo '337636d9da2bc8f13e1d0489aac62335e9fb3112d844994b1508e385a49f18bc  /tmp/final-territories/river-final.png' | sha256sum -c -
          cp /tmp/final-territories/*-final.png assets/territory-planets/
      - name: Mount final textures and update integrity protection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/territory-cosmos.js')
          s=p.read_text()
          for name in ('hearthlands','roadlands','littoral','institutional','river'):
              s=s.replace(f'/assets/territory-planets/{name}-path2-test.png',f'/assets/territory-planets/{name}-final.png')
          s=s.replace("cue:'Tides · islands · shorelines'","cue:'Shorelines · tides · thresholds'")
          s=s.replace("cue:'Structure · authority · public space'","cue:'Structure · order · public life'")
          p.write_text(s)
          PY
          cat > tests/territory-cosmos-integrity.mjs <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const source=fs.readFileSync('src/territory-cosmos.js','utf8');
          const ids=['hearthlands','roadlands','littoral','institutional','river'];
          for(const id of ids){
            const rel=`assets/territory-planets/${id}-final.png`;
            assert.ok(fs.existsSync(rel),`${rel} must exist`);
            assert.ok(source.includes(`/assets/territory-planets/${id}-final.png`),`${id} final texture path missing`);
          }
          const sizes=ids.map(id=>fs.statSync(`assets/territory-planets/${id}-final.png`).size);
          assert.equal(new Set(sizes).size,5,'final territory assets should be five distinct files');
          assert.doesNotMatch(source,/path2-test\.png/,'temporary Path 2 texture reference must be gone');
          assert.doesNotMatch(source,/q18-clean\.(?:png|jpg)/,'q18-clean texture references must not be active');
          assert.match(source,/new THREE\.SphereGeometry\(1,128,96\)/);
          assert.match(source,/mesh\.rotation\.y\s*\+=/);
          assert.match(source,/texture\.wrapS=THREE\.RepeatWrapping/);
          assert.match(source,/texture\.wrapT=THREE\.ClampToEdgeWrapping/);
          assert.match(source,/texture\.minFilter=THREE\.LinearFilter/);
          assert.match(source,/texture\.magFilter=THREE\.LinearFilter/);
          assert.match(source,/texture\.generateMipmaps=false/);
          assert.match(source,/MOBILE_POSITIONS/);
          assert.match(source,/totalDreams:362/);
          assert.match(source,/hearthlands:213/);
          assert.match(source,/roadlands:null,littoral:null,institutional:null,river:null/);
          assert.match(source,/Home · gardens · belonging/);
          assert.match(source,/Journeys · crossings · movement/);
          assert.match(source,/Shorelines · tides · thresholds/);
          assert.match(source,/Structure · order · public life/);
          assert.match(source,/Waterways · bridges · flow/);
          console.log('Territory cosmos integrity: five final territory textures mounted one-to-one.');
          JS
          cat > tools/validate_territory_planets.py <<'PY'
          from pathlib import Path
          import numpy as np
          from PIL import Image

          IDS=('hearthlands','roadlands','littoral','institutional','river')
          root=Path('assets/territory-planets')
          fingerprints=set()
          for name in IDS:
              path=root/f'{name}-final.png'
              with Image.open(path) as im:
                  if im.mode not in ('RGB','RGBA'):
                      raise SystemExit(f'MODE FAIL {name}: {im.mode}')
                  if im.size != (2048,1024):
                      raise SystemExit(f'SIZE FAIL {name}: {im.size}')
                  arr=np.asarray(im.convert('RGB'),dtype=np.float32)
              fp=hash(path.read_bytes())
              if fp in fingerprints: raise SystemExit(f'DUPLICATE FILE {name}')
              fingerprints.add(fp)
              if float(arr.std()) < 8: raise SystemExit(f'LOW VARIANCE {name}')
              sectors=np.array_split(arr,24,axis=1)
              min_sector=min(float(s.mean()) for s in sectors)
              if min_sector < 20: raise SystemExit(f'BLACK/EMPTY LONGITUDE {name}: {min_sector:.2f}')
              seam=float(np.abs(arr[:,0,:]-arr[:,-1,:]).mean())
              if seam > 25: raise SystemExit(f'SEAM FAIL {name}: {seam:.2f}')
              g=arr.mean(axis=2)
              gx=np.abs(np.diff(g,axis=1,prepend=g[:,:1])); gy=np.abs(np.diff(g,axis=0,prepend=g[:1,:]))
              detail=(gx+gy).mean(axis=0)
              # Detect an abrupt broad vertical blur strip relative to its local flanks,
              # without penalising naturally smoother deserts, water or wetlands.
              w=64
              worst=1.0
              for x in range(w*2, len(detail)-w*2, 16):
                  c=float(detail[x-w//2:x+w//2].mean())
                  l=float(detail[x-w*2:x-w].mean())
                  r=float(detail[x+w:x+w*2].mean())
                  flank=min(l,r)
                  if flank>0: worst=min(worst,c/flank)
              if worst < 0.48: raise SystemExit(f'ABRUPT LONGITUDE BLUR STRIP {name}: ratio={worst:.3f}')
              print(f'{name}: 2048x1024 RGB, seam={seam:.2f}, min-sector={min_sector:.1f}, blur-strip-ratio={worst:.3f}')
          print('Validated five distinct final full-surface territory textures.')
          PY
      - name: Run full integrity suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow numpy
          node tests/family-home-integrity.mjs
          node tests/territory-cosmos-integrity.mjs
          python tools/validate_territory_planets.py
      - name: Commit final territory mount and remove importer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-final-territory-textures.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Mount approved final territory planet textures'
          git push origin HEAD:family-home-pilot
