name: Inspect Hearthlands transfer API v5

on:
  push:
    paths:
      - '.github/workflows/inspect-hearthlands-transfer-v5.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect module prefix
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          js=urllib.request.urlopen('https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js').read().decode('utf-8','ignore')
          i=js.find('function b(e,a)')
          print('index',i)
          print(js[max(0,i-9000):i+1200])
          PY
