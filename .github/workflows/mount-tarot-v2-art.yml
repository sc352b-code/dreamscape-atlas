name: Mount Tarot v2 exemplar artwork

on:
  push:
    branches: [family-home-pilot]
    paths:
      - '.github/workflows/mount-tarot-v2-art.yml'

permissions:
  contents: write

jobs:
  mount:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: family-home-pilot
      - name: Download exact generated tarot artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p worlds/reference-world/territories/hearthlands/tarot/art
          fetch_firestorage () {
            local share="$1"
            local file_id="$2"
            local output="$3"
            local api="https://api.firestorage.ai/dev/file/shares/${share}/files/${file_id}/download"
            local json
            json="$(curl -fsS -X POST "$api")"
            local url
            url="$(python -c 'import json,sys; print(json.load(sys.stdin)["downloadUrl"])' <<<"$json")"
            curl -fsSL "$url" -o "$output"
          }
          fetch_firestorage "AzA1AeHDeMBQ" "01a0d263fb66706698ee266452b76b6a" "worlds/reference-world/territories/hearthlands/tarot/art/family-home-v2.png"
          fetch_firestorage "IMDW17WVDEDu" "01a0d2642c0671919d3ece5f854b3085" "worlds/reference-world/territories/hearthlands/tarot/art/water-v2.png"
          fetch_firestorage "LiVYJPS78Vg_" "01a0d2645612730f9bf88eccffc2fac7" "worlds/reference-world/territories/hearthlands/tarot/art/natalie-v2.png"
          echo "f8f4591a31d89d141a782d61455cfade526b13fe2ff9809058b415e663e16ed1  worlds/reference-world/territories/hearthlands/tarot/art/family-home-v2.png" | sha256sum -c -
          echo "825e7ead174d9b8121b107108e8d708175bacbb04dad76ac8d48e0f574092be5  worlds/reference-world/territories/hearthlands/tarot/art/water-v2.png" | sha256sum -c -
          echo "2db55419f67290583c2401675c8152ccf5769e6be8d04262f60b82356eda5fea  worlds/reference-world/territories/hearthlands/tarot/art/natalie-v2.png" | sha256sum -c -
      - name: Commit artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dreamscape-build"
          git config user.email "actions@users.noreply.github.com"
          git add worlds/reference-world/territories/hearthlands/tarot/art/
          git diff --cached --quiet && exit 0
          git commit -m "Mount Tarot v2 exemplar artwork"
          git push origin HEAD:family-home-pilot
