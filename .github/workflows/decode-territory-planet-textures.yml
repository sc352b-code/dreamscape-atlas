name: Decode territory planet textures

on:
  push:
    branches: [family-home-pilot]
    paths:
      - 'assets/territory-planets-source/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: family-home-pilot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validation dependency
        run: python -m pip install --quiet pillow
      - name: Rebuild high-resolution planet textures
        run: |
          python - <<'PY'
          import base64, glob, os
          from PIL import Image
          names=['hearthlands','roadlands','littoral','institutional','river']
          source='assets/territory-planets-source'
          target='assets/territory-planets'
          os.makedirs(target,exist_ok=True)
          for name in names:
              parts=sorted(glob.glob(f'{source}/{name}-*.b64'))
              if not parts:
                  raise SystemExit(f'Missing chunks for {name}')
              payload=''.join(open(p,encoding='utf-8').read().strip() for p in parts)
              data=base64.b64decode(payload,validate=True)
              out=f'{target}/{name}.webp'
              open(out,'wb').write(data)
              with Image.open(out) as image:
                  if image.size != (1024,512):
                      raise SystemExit(f'{name}: expected 1024x512, got {image.size}')
              if len(data) < 100000:
                  raise SystemExit(f'{name}: suspiciously small texture ({len(data)} bytes)')
              print(name, len(data), 'bytes', '1024x512')
          PY
      - name: Commit rebuilt binary textures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/territory-planets/*.webp
          if git diff --cached --quiet; then
            echo 'Textures already current.'
          else
            git commit -m 'Upgrade five territory planet textures to 1024'
            git push origin HEAD:family-home-pilot
          fi
