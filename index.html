<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050614" />
    <title>Dreamscape — Living Dream Atlas</title>
    <style>
      html,body{margin:0;width:100%;height:100%;background:#030611;color:#f7ead8;overflow:hidden}
      #app{width:100%;height:100%}
      #boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#111b43 0,#070b1d 42%,#02040b 78%);font-family:Georgia,serif;letter-spacing:.08em;text-align:center}
      #boot div{padding:28px}
      #boot b{display:block;font-size:38px;font-weight:400;color:#f7e5c4;text-shadow:0 0 26px rgba(247,218,167,.22)}
      #boot span{display:block;margin-top:12px;font:12px system-ui,sans-serif;letter-spacing:.18em;color:#b8adc5;text-transform:uppercase}
      #boot.error b{font-size:24px}
    </style>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/buildpass.css" />
    <link rel="stylesheet" href="/src/atlas-polish.css" />
    <link rel="stylesheet" href="/src/family-home-pilot.css" />
    <link rel="stylesheet" href="/src/family-home-approach.css" />
  </head>
  <body>
    <main id="app"><div id="boot"><div><b>Dreamscape</b><span>Entering your living dream world…</span></div></div></main>
    <script>
      const bootError = () => {
        const boot = document.querySelector('#boot');
        if (!boot) return;
        boot.classList.add('error');
        boot.innerHTML = '<div><b>The Dream Atlas could not start.</b><span>Please refresh once. If this remains, the deployment needs repair.</span></div>';
      };
      window.addEventListener('error', bootError);
      window.addEventListener('unhandledrejection', bootError);
    </script>
    <script src="/src/buildpass-prelude.js"></script>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/v57-hearthlands-geography.js"></script>
    <script type="module" src="/src/family-home-pilot.js"></script>
    <script type="module" src="/src/family-home-approach.js"></script>
    <script type="module" src="/src/cosmos-ambience.js"></script>
  </body>
</html>
