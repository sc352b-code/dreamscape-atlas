name: Import exact q18 territory textures

on:
  push:
    branches: [family-home-pilot]
    paths:
      - '.github/workflows/import-q18-textures.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-q18:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SHARE_ID: -suabnPyUpx5
      API_BASE: https://api.firestorage.ai/dev/file
      ZIP_SHA256: 322bbce1af4ef598e05d28eeb6dd2d479ce4db7a31ae68815ed97110a46a3e76
    steps:
      - uses: actions/checkout@v4
        with:
          ref: family-home-pilot
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact q18 bundle through firestorage API
        shell: bash
        run: |
          set -euo pipefail
          LIST_JSON="$(curl -L --max-time 20 --fail --silent --show-error "$API_BASE/shares/$SHARE_ID/files?maxResults=1000")"
          FILE_ID="$(printf '%s' "$LIST_JSON" | jq -r '.files[] | select(.fileName == "territory-sources-q18.zip") | .fileId' | head -1)"
          test -n "$FILE_ID" && test "$FILE_ID" != "null"
          DOWNLOAD_JSON="$(curl -L --max-time 20 --fail --silent --show-error -X POST "$API_BASE/shares/$SHARE_ID/files/$FILE_ID/download")"
          DOWNLOAD_URL="$(printf '%s' "$DOWNLOAD_JSON" | jq -r '.downloadUrl')"
          test -n "$DOWNLOAD_URL" && test "$DOWNLOAD_URL" != "null"
          curl -L --max-time 60 --fail --silent --show-error "$DOWNLOAD_URL" -o /tmp/q18.zip
          echo "$ZIP_SHA256  /tmp/q18.zip" | sha256sum -c -
      - name: Verify and mount the five exact JPEGs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/q18 && mkdir -p /tmp/q18
          unzip -q /tmp/q18.zip -d /tmp/q18
          echo '45df38c01f03a99f2b5bb7d88754011e33fba063ebb021d2b66bbf8411b8299c  /tmp/q18/hearthlands.jpg' | sha256sum -c -
          echo 'a0288bd86c4c6f3ec844d3c078d6ab5dadbbc8d65a07b660bd10d02020b0eccd  /tmp/q18/roadlands.jpg' | sha256sum -c -
          echo '33b9c65a3d77921e613c0230f4b2579dd6ecc5988eb07e7f03f9fcf0461d0cf3  /tmp/q18/littoral.jpg' | sha256sum -c -
          echo '43d9bbc6a4c65676418abc3a21ad9a4facd2ba2e9d1c9333f27c6844fb02e8f3  /tmp/q18/institutional.jpg' | sha256sum -c -
          echo '091ad36ab28c5f2548f45aa92674c3388a3c8f45f20b8b0b01c709fdc08e67a7  /tmp/q18/river.jpg' | sha256sum -c -
          mkdir -p assets/territory-planets
          cp /tmp/q18/hearthlands.jpg assets/territory-planets/hearthlands.jpg
          cp /tmp/q18/roadlands.jpg assets/territory-planets/roadlands.jpg
          cp /tmp/q18/littoral.jpg assets/territory-planets/littoral.jpg
          cp /tmp/q18/institutional.jpg assets/territory-planets/institutional.jpg
          cp /tmp/q18/river.jpg assets/territory-planets/river.jpg
          rm -f assets/territory-planets/*.webp
      - name: Wire renderer to exact JPEGs and replace stale integrity checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/territory-cosmos.js')
          s=p.read_text()
          for name in ('hearthlands','roadlands','littoral','institutional','river'):
              old=f'/assets/territory-planets/{name}.webp'
              new=f'/assets/territory-planets/{name}.jpg'
              if old not in s:
                  raise SystemExit(f'missing expected renderer path: {old}')
              s=s.replace(old,new)
          p.write_text(s)
          PY
          cat > tests/territory-cosmos-integrity.mjs <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const source=fs.readFileSync('src/territory-cosmos.js','utf8');
          const expected={
            hearthlands:'45df38c01f03a99f2b5bb7d88754011e33fba063ebb021d2b66bbf8411b8299c',
            roadlands:'a0288bd86c4c6f3ec844d3c078d6ab5dadbbc8d65a07b660bd10d02020b0eccd',
            littoral:'33b9c65a3d77921e613c0230f4b2579dd6ecc5988eb07e7f03f9fcf0461d0cf3',
            institutional:'43d9bbc6a4c65676418abc3a21ad9a4facd2ba2e9d1c9333f27c6844fb02e8f3',
            river:'091ad36ab28c5f2548f45aa92674c3388a3c8f45f20b8b0b01c709fdc08e67a7',
          };
          for(const [id,hash] of Object.entries(expected)){
            const rel=`assets/territory-planets/${id}.jpg`;
            assert.ok(fs.existsSync(rel),`${rel} must exist`);
            const bytes=fs.readFileSync(rel);
            assert.equal(bytes[0],0xff); assert.equal(bytes[1],0xd8); assert.equal(bytes[2],0xff);
            assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'),hash,`${id} must be the exact q18 JPEG`);
            assert.ok(source.includes(`/assets/territory-planets/${id}.jpg`),`${id} renderer JPEG path missing`);
            assert.ok(!source.includes(`/assets/territory-planets/${id}.webp`),`${id} must not use old WebP`);
          }
          assert.equal(new Set(Object.keys(expected)).size,5);
          assert.match(source,/new THREE\.SphereGeometry\(1,128,96\)/,'real high-resolution sphere geometry required');
          assert.match(source,/mesh\.rotation\.y\s*\+=/,'each world must rotate as a 3D mesh');
          assert.match(source,/texture\.wrapS=THREE\.RepeatWrapping/,'horizontal texture repeat required');
          assert.match(source,/texture\.wrapT=THREE\.ClampToEdgeWrapping/,'vertical clamp required');
          assert.match(source,/texture\.anisotropy=renderer\.capabilities\.getMaxAnisotropy\(\)/,'anisotropic filtering required');
          assert.match(source,/emissiveMap:texture/,'texture-backed emissive visibility floor required');
          assert.match(source,/new THREE\.AmbientLight\(0xffffff,1\.45\)/,'ambient geography visibility floor required');
          assert.match(source,/MOBILE_POSITIONS/,'mobile five-world layout must remain');
          for(const id of Object.keys(expected)) assert.match(source,new RegExp(`${id}:\\[`),`${id} mobile position missing`);
          assert.match(source,/totalDreams:362/,'corpus total must remain 362');
          assert.match(source,/hearthlands:213/,'Hearthlands corpus count must remain 213');
          console.log('Territory cosmos integrity: exact q18 JPEGs + five rotating Three.js worlds verified.');
          JS
          cat > tools/validate_territory_planets.py <<'PY'
          from pathlib import Path
          import hashlib
          import numpy as np
          from PIL import Image

          EXPECTED={
              'hearthlands':'45df38c01f03a99f2b5bb7d88754011e33fba063ebb021d2b66bbf8411b8299c',
              'roadlands':'a0288bd86c4c6f3ec844d3c078d6ab5dadbbc8d65a07b660bd10d02020b0eccd',
              'littoral':'33b9c65a3d77921e613c0230f4b2579dd6ecc5988eb07e7f03f9fcf0461d0cf3',
              'institutional':'43d9bbc6a4c65676418abc3a21ad9a4facd2ba2e9d1c9333f27c6844fb02e8f3',
              'river':'091ad36ab28c5f2548f45aa92674c3388a3c8f45f20b8b0b01c709fdc08e67a7',
          }
          root=Path('assets/territory-planets')
          seen=set()
          for name,expected_hash in EXPECTED.items():
              path=root/f'{name}.jpg'
              if not path.exists(): raise SystemExit(f'MISSING {path}')
              raw=path.read_bytes(); got=hashlib.sha256(raw).hexdigest()
              if got != expected_hash: raise SystemExit(f'HASH FAIL {name}: {got}')
              if got in seen: raise SystemExit(f'DUPLICATE texture hash: {name}')
              seen.add(got)
              with Image.open(path) as im:
                  if im.format != 'JPEG': raise SystemExit(f'FORMAT FAIL {name}: {im.format}')
                  if im.size != (768,384): raise SystemExit(f'SIZE FAIL {name}: {im.size}')
                  arr=np.asarray(im.convert('RGB'),dtype=np.float32)
              if float(arr.std()) < 8: raise SystemExit(f'LOW VARIANCE {name}')
              sector_means=[]
              for sector in np.array_split(arr,24,axis=1): sector_means.append(float(sector.mean()))
              if min(sector_means) < 20: raise SystemExit(f'BLACK/EMPTY LONGITUDE SECTOR {name}: {min(sector_means):.2f}')
              for idx,view in enumerate(np.array_split(arr,4,axis=1)):
                  if float(view.std()) < 6 or float(view.mean()) < 20:
                      raise SystemExit(f'INVALID 90-DEGREE VIEW {name} #{idx+1}')
              seam=float(np.abs(arr[:,0,:]-arr[:,-1,:]).mean())
              if seam > 25: raise SystemExit(f'EXCESSIVE HORIZONTAL SEAM {name}: {seam:.2f}')
              print(f'{name}: 768x384 JPEG sha256={got[:12]}… min-sector={min(sector_means):.2f} seam-MAE={seam:.2f}')
          print('Validated five distinct exact q18 territory JPEGs across the full 360-degree surface.')
          PY
          rm -rf transfer/q18-hearthlands transfer/q18-roadlands transfer/q18-import-v2 transfer/planet-bundle-q18
          rm -f .github/workflows/decode-territory-planet-textures.yml
      - name: Run final territory and Family Home integrity checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow numpy
          node tests/territory-cosmos-integrity.mjs
          node tests/family-home-integrity.mjs
          python tools/validate_territory_planets.py
      - name: Commit finished five-planet q18 mount and remove temporary import workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-q18-textures.yml .github/workflows/diagnose-firestorage-q18.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Mount exact q18 textures on five territory planets'
          git push origin HEAD:family-home-pilot
