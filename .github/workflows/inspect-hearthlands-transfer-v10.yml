name: Inspect Hearthlands go resolver v10

on:
  push:
    paths:
      - '.github/workflows/inspect-hearthlands-transfer-v10.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect go resolver
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, json, re
          api='https://api.firestorage.ai/dev/file'
          req=urllib.request.Request(api+'/shares/xlFG0U8XX0Mc/cushion-sessions',data=b'{"password":null}',headers={'Content-Type':'application/json'},method='POST')
          cid=json.loads(urllib.request.urlopen(req).read().decode())['cushionId']
          page='https://firestorage.ai/ja/go/'+cid+'/'
          html=urllib.request.urlopen(page).read().decode('utf-8','ignore')
          print('CID',cid)
          print('PAGEHTML',html)
          scripts=re.findall(r'<script[^>]+src="([^"]+)"',html)
          for src in scripts:
              url=urllib.parse.urljoin('https://firestorage.ai',src)
              try: js=urllib.request.urlopen(url).read().decode('utf-8','ignore')
              except: continue
              if cid in js or 'cushion' in js.lower() or '/go/' in js:
                  print('\n===SCRIPT',url,'===')
                  for tok in ['cushion','/go/','/objects/','resolve']:
                      i=js.lower().find(tok.lower())
                      if i>=0: print(js[max(0,i-4000):min(len(js),i+8000)])
          PY