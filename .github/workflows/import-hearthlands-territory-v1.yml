name: Import Hearthlands Territory v1

on:
  push:
    branches: [family-home-pilot]
    paths:
      - '.github/workflows/import-hearthlands-territory-v1.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: family-home-pilot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser downloader
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Download verified build package
        env:
          SHARE_URL: https://firestorage.ai/ja/f/ZjrzRic2d6JH
          EXPECTED_SHA256: 903ac0c82d23df29f4916df17e0637a878fef36d74acd3300cbe6be67e339bad
          EXPECTED_NAME: hearthlands-territory-v1-build.zip
        run: |
          python - <<'PY'
          import hashlib, os, re
          from pathlib import Path
          from urllib.parse import urljoin
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeoutError

          share=os.environ['SHARE_URL']
          expected=os.environ['EXPECTED_SHA256']
          expected_name=os.environ['EXPECTED_NAME']
          out=Path('/tmp/hearthlands-territory-v1-build.zip')

          def verified(path):
              if not path.exists(): return False
              return hashlib.sha256(path.read_bytes()).hexdigest()==expected

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              context=browser.new_context(accept_downloads=True)
              page=context.new_page()
              page.goto(share, wait_until='networkidle', timeout=90000)
              page.wait_for_timeout(2500)

              candidates=[]
              for selector in ['a','button']:
                  for el in page.locator(selector).all():
                      try:
                          text=(el.inner_text(timeout=1000) or '').strip()
                          href=el.get_attribute('href') or ''
                          score=0
                          hay=(text+' '+href).lower()
                          if expected_name.lower() in hay: score+=10
                          if '.zip' in hay: score+=6
                          if 'download' in hay or 'ダウンロード' in hay: score+=5
                          if score: candidates.append((score,el,text,href))
                      except Exception:
                          pass
              candidates.sort(key=lambda row:row[0], reverse=True)

              # Prefer a real browser download, which works for signed/JS-backed links.
              for _,el,text,href in candidates:
                  try:
                      with page.expect_download(timeout=12000) as info:
                          el.click(force=True, timeout=5000)
                      download=info.value
                      download.save_as(str(out))
                      if verified(out):
                          print('Verified download via UI:', text or href)
                          browser.close()
                          break
                  except Exception:
                      pass
              else:
                  # Try direct candidate/resource URLs if the page exposes a signed asset.
                  urls=[]
                  for _,_,_,href in candidates:
                      if href: urls.append(urljoin(share,href))
                  try:
                      urls += page.evaluate("performance.getEntriesByType('resource').map(e => e.name)")
                  except Exception:
                      pass
                  html=page.content().replace('\\u002F','/').replace('\\/','/')
                  urls += re.findall(r'https?://[^\"\'<>\\s]+', html)
                  seen=set()
                  for url in urls:
                      if not url or url in seen: continue
                      seen.add(url)
                      low=url.lower()
                      if not ('.zip' in low or 'download' in low or 'file' in low): continue
                      try:
                          response=context.request.get(url, timeout=15000)
                          if response.ok:
                              out.write_bytes(response.body())
                              if verified(out):
                                  print('Verified download via resource:', url)
                                  browser.close()
                                  break
                      except Exception:
                          pass
                  else:
                      browser.close()
                      raise SystemExit('Could not resolve a verified firestorage download for the build package.')

          if not verified(out):
              raise SystemExit('Downloaded package SHA-256 did not match the locally verified build.')
          print('Package SHA-256 verified:', expected)
          PY
      - name: Import Territory Layer v1 files
        run: |
          rm -rf /tmp/hearthlands-v1-import
          mkdir -p /tmp/hearthlands-v1-import
          unzip -q /tmp/hearthlands-territory-v1-build.zip -d /tmp/hearthlands-v1-import
          rsync -a /tmp/hearthlands-v1-import/ ./
          rm -f .github/workflows/import-hearthlands-territory-v1.yml
          node --check src/hearthlands-territory-v1.js
          node tests/hearthlands-territory-v1-integrity.mjs
          sha256sum worlds/reference-world/territories/hearthlands/assets/hearthlands-flat-map.png
      - name: Commit Hearthlands Territory Layer v1
        run: |
          git config user.name 'dreamscape-engine-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Hearthlands Territory Layer v1'
          git push origin HEAD:family-home-pilot
