name: Diagnose firestorage q18 share

on:
  push:
    branches: [family-home-pilot]
    paths:
      - '.github/workflows/diagnose-firestorage-q18.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Capture firestorage API responses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          api='https://api.firestorage.ai/dev/file'
          share='-suabnPyUpx5'
          curl -L --max-time 20 --fail --silent --show-error "$api/shares/$share/files?maxResults=1000" -o out/list.json
          python -m json.tool out/list.json > out/list.pretty.json
          python - <<'PY'
          import json
          d=json.load(open('out/list.json'))
          print('keys', sorted(d.keys()))
          for i,f in enumerate(d.get('files', [])):
              print('FILE', i, f)
          PY
          python - <<'PY' > out/file-id.txt
          import json
          d=json.load(open('out/list.json'))
          files=d.get('files',[])
          if not files: raise SystemExit('no files')
          f=next((x for x in files if x.get('fileName')=='territory-sources-q18.zip' or x.get('file_name')=='territory-sources-q18.zip'),files[0])
          print(f.get('fileId') or f.get('file_id') or f.get('id') or '')
          PY
          file_id="$(cat out/file-id.txt)"
          test -n "$file_id"
          curl -L --max-time 20 --fail --silent --show-error -X POST "$api/shares/$share/files/$file_id/download" -o out/download.json
          python -m json.tool out/download.json > out/download.pretty.json
          cat out/list.pretty.json
          cat out/download.pretty.json
      - uses: actions/upload-artifact@v4
        with:
          name: firestorage-q18-api-diagnostic
          path: out/
          if-no-files-found: error
          retention-days: 1
