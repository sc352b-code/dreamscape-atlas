name: Mount locked Hearthlands artwork verified

on:
  push:
    paths:
      - '.github/workflows/mount-locked-hearthlands-artwork-verified.yml'

permissions:
  contents: write

jobs:
  mount:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: family-home-pilot
      - name: Download and verify locked artwork
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,json,hashlib,pathlib
          api='https://api.firestorage.ai/dev/file'
          share='xlFG0U8XX0Mc'
          expected='b7be292766f9bf0774c1fc358154adf522006ac9933b05a3a5469d29a8d917b3'
          req=urllib.request.Request(api+'/shares/'+share+'/cushion-sessions',data=b'{"password":null}',headers={'Content-Type':'application/json'},method='POST')
          cid=json.loads(urllib.request.urlopen(req).read().decode())['cushionId']
          req=urllib.request.Request(api+'/cushions/'+cid+'/resolve',data=b'',method='POST')
          final_id=json.loads(urllib.request.urlopen(req).read().decode())['finalId']
          req=urllib.request.Request(api+'/download-sessions/'+final_id+'/files?maxResults=1000',data=b'',method='POST')
          payload=json.loads(urllib.request.urlopen(req).read().decode())
          print('download session files',payload)
          files=payload.get('files') or []
          if len(files)!=1: raise SystemExit('Expected exactly one transferred file')
          f=files[0]
          url=f.get('downloadUrl') or f.get('url')
          if not url:
              file_id=f.get('fileId')
              if not file_id: raise SystemExit('No file id/download URL in download session')
              dreq=urllib.request.Request(api+'/download-sessions/'+final_id+'/files/'+file_id+'/download',data=b'',method='POST')
              d=json.loads(urllib.request.urlopen(dreq).read().decode())
              url=d.get('downloadUrl') or d.get('url')
          if not url: raise SystemExit('No download URL resolved')
          data=urllib.request.urlopen(url).read()
          actual=hashlib.sha256(data).hexdigest()
          print('downloaded bytes',len(data),'sha256',actual)
          if actual!=expected: raise SystemExit('SHA mismatch: '+actual)
          pathlib.Path('/tmp/hearthlands-flat-map.png').write_bytes(data)
          PY
      - name: Replace and push Hearthlands asset
        shell: bash
        run: |
          cp /tmp/hearthlands-flat-map.png worlds/reference-world/territories/hearthlands/assets/hearthlands-flat-map.png
          test "$(sha256sum worlds/reference-world/territories/hearthlands/assets/hearthlands-flat-map.png | awk '{print $1}')" = "b7be292766f9bf0774c1fc358154adf522006ac9933b05a3a5469d29a8d917b3"
          git config user.name "dreamscape-build"
          git config user.email "dreamscape-build@users.noreply.github.com"
          git add worlds/reference-world/territories/hearthlands/assets/hearthlands-flat-map.png
          if git diff --cached --quiet; then echo 'Asset already exact'; exit 0; fi
          git commit -m "Mount locked final Hearthlands artwork"
          git push origin HEAD:family-home-pilot