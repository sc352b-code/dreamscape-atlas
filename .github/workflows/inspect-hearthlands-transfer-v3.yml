name: Inspect Hearthlands transfer API v3

on:
  push:
    paths:
      - '.github/workflows/inspect-hearthlands-transfer-v3.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Firestorage app bundle
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,re,urllib.parse
          base='https://firestorage.ai'
          share=base+'/ja/f/xlFG0U8XX0Mc'
          html=urllib.request.urlopen(share).read().decode('utf-8','ignore')
          scripts=re.findall(r'<script[^>]+src="([^"]+)"',html)
          print('scripts',scripts)
          for src in scripts:
            url=urllib.parse.urljoin(base,src)
            try:
              js=urllib.request.urlopen(url).read().decode('utf-8','ignore')
            except Exception as e:
              print('ERR',url,e); continue
            if 'download' in js.lower() or '/api/' in js or 'share' in js.lower():
              print('\n===',url,'bytes',len(js),'===')
              for pat in ['download','/api/','shareId','publicId','file_id','fileId','signed']:
                for m in re.finditer(pat,js,re.I):
                  a=max(0,m.start()-500); b=min(len(js),m.start()+1200)
                  print(js[a:b])
                  print('\n---')
                  break
          PY
