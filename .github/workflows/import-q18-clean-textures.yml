name: Import cleaned q18 sphere-ready textures

on:
  push:
    branches: [family-home-pilot]
    paths:
      - '.github/workflows/import-q18-clean-textures.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-clean-q18:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHARE_ID: ug226cp0v5ot
      API_BASE: https://api.firestorage.ai/dev/file
      ZIP_SHA256: 00928aa1f0c6014f0d2a94711f14e84faf1212f916638dae634264ee5ec9adf3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: family-home-pilot
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact cleaned q18 bundle
        shell: bash
        run: |
          set -euo pipefail
          LIST_JSON="$(curl -L --max-time 20 --fail --silent --show-error "$API_BASE/shares/$SHARE_ID/files?maxResults=1000")"
          FILE_ID="$(printf '%s' "$LIST_JSON" | jq -r '.files[] | select(.fileName == "q18-clean-textures.zip") | .fileId' | head -1)"
          test -n "$FILE_ID" && test "$FILE_ID" != "null"
          DOWNLOAD_JSON="$(curl -L --max-time 20 --fail --silent --show-error -X POST "$API_BASE/shares/$SHARE_ID/files/$FILE_ID/download")"
          DOWNLOAD_URL="$(printf '%s' "$DOWNLOAD_JSON" | jq -r '.downloadUrl')"
          test -n "$DOWNLOAD_URL" && test "$DOWNLOAD_URL" != "null"
          curl -L --max-time 90 --fail --silent --show-error "$DOWNLOAD_URL" -o /tmp/q18-clean.zip
          echo "$ZIP_SHA256  /tmp/q18-clean.zip" | sha256sum -c -
      - name: Verify and install clean sphere-ready textures
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/q18-clean && mkdir -p /tmp/q18-clean
          unzip -q /tmp/q18-clean.zip -d /tmp/q18-clean
          echo 'fe18c3e4b4eddd20a027f409e03f9249b27100c7e48c292973f2f12e57143cf3  /tmp/q18-clean/hearthlands-q18-clean.jpg' | sha256sum -c -
          echo 'bc8d6dd6fa0f1650d9915819580d92ecf7c7277e5b135733e052f50b977c3b29  /tmp/q18-clean/roadlands-q18-clean.jpg' | sha256sum -c -
          echo '707e5d1eb41f65750cfd8baa1a890ff5f6a535177306a75cbfd52616528a3e85  /tmp/q18-clean/littoral-q18-clean.jpg' | sha256sum -c -
          echo 'fb7b0ba4ef6e0ca0d5d24e19f1d2c3d5d5cace95a8c06cd9c199654727e10871  /tmp/q18-clean/institutional-q18-clean.jpg' | sha256sum -c -
          echo 'dbab882b84c498577200cd90c7379a915a00ee1ffbe6afd61eba31077800e8b0  /tmp/q18-clean/river-q18-clean.jpg' | sha256sum -c -
          cp /tmp/q18-clean/*-q18-clean.jpg assets/territory-planets/
      - name: Rewire renderer and strengthen integrity checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/territory-cosmos.js')
          s=p.read_text()
          for name in ('hearthlands','roadlands','littoral','institutional','river'):
              s=s.replace(f'/assets/territory-planets/{name}.jpg',f'/assets/territory-planets/{name}-q18-clean.jpg')
          p.write_text(s)
          PY
          cat > tests/territory-cosmos-integrity.mjs <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const source=fs.readFileSync('src/territory-cosmos.js','utf8');
          const expected={
            hearthlands:'fe18c3e4b4eddd20a027f409e03f9249b27100c7e48c292973f2f12e57143cf3',
            roadlands:'bc8d6dd6fa0f1650d9915819580d92ecf7c7277e5b135733e052f50b977c3b29',
            littoral:'707e5d1eb41f65750cfd8baa1a890ff5f6a535177306a75cbfd52616528a3e85',
            institutional:'fb7b0ba4ef6e0ca0d5d24e19f1d2c3d5d5cace95a8c06cd9c199654727e10871',
            river:'dbab882b84c498577200cd90c7379a915a00ee1ffbe6afd61eba31077800e8b0',
          };
          for(const [id,hash] of Object.entries(expected)){
            const rel=`assets/territory-planets/${id}-q18-clean.jpg`;
            assert.ok(fs.existsSync(rel),`${rel} must exist`);
            assert.equal(crypto.createHash('sha256').update(fs.readFileSync(rel)).digest('hex'),hash,`${id} clean texture hash mismatch`);
            assert.ok(source.includes(`/assets/territory-planets/${id}-q18-clean.jpg`),`${id} clean renderer path missing`);
          }
          assert.match(source,/new THREE\.SphereGeometry\(1,128,96\)/);
          assert.match(source,/mesh\.rotation\.y\s*\+=/);
          assert.match(source,/texture\.wrapS=THREE\.RepeatWrapping/);
          assert.match(source,/texture\.wrapT=THREE\.ClampToEdgeWrapping/);
          assert.match(source,/texture\.anisotropy=renderer\.capabilities\.getMaxAnisotropy\(\)/);
          assert.match(source,/texture\.minFilter=THREE\.LinearFilter/);
          assert.match(source,/texture\.magFilter=THREE\.LinearFilter/);
          assert.match(source,/texture\.generateMipmaps=false/);
          assert.match(source,/emissiveMap:texture/);
          assert.match(source,/MOBILE_POSITIONS/);
          assert.match(source,/totalDreams:362/);
          assert.match(source,/hearthlands:213/);
          console.log('Territory cosmos integrity: cleaned q18 sphere-ready textures verified.');
          JS
          cat > tools/validate_territory_planets.py <<'PY'
          from pathlib import Path
          import hashlib
          import numpy as np
          from PIL import Image

          EXPECTED={
              'hearthlands':'fe18c3e4b4eddd20a027f409e03f9249b27100c7e48c292973f2f12e57143cf3',
              'roadlands':'bc8d6dd6fa0f1650d9915819580d92ecf7c7277e5b135733e052f50b977c3b29',
              'littoral':'707e5d1eb41f65750cfd8baa1a890ff5f6a535177306a75cbfd52616528a3e85',
              'institutional':'fb7b0ba4ef6e0ca0d5d24e19f1d2c3d5d5cace95a8c06cd9c199654727e10871',
              'river':'dbab882b84c498577200cd90c7379a915a00ee1ffbe6afd61eba31077800e8b0',
          }
          root=Path('assets/territory-planets')
          hashes=set()
          for name,expected in EXPECTED.items():
              path=root/f'{name}-q18-clean.jpg'
              raw=path.read_bytes(); got=hashlib.sha256(raw).hexdigest()
              if got != expected: raise SystemExit(f'HASH FAIL {name}: {got}')
              if got in hashes: raise SystemExit(f'DUPLICATE HASH {name}')
              hashes.add(got)
              with Image.open(path) as im:
                  if im.format != 'JPEG': raise SystemExit(f'FORMAT FAIL {name}: {im.format}')
                  if im.size != (2048,1024): raise SystemExit(f'SIZE FAIL {name}: {im.size}')
                  arr=np.asarray(im.convert('RGB'),dtype=np.float32)
              if float(arr.std()) < 8: raise SystemExit(f'LOW VARIANCE {name}')
              sectors=np.array_split(arr,24,axis=1)
              if min(float(s.mean()) for s in sectors) < 20: raise SystemExit(f'BLACK/EMPTY LONGITUDE {name}')
              quarters=np.array_split(arr,4,axis=1)
              qdetail=[]
              for q in quarters:
                  g=q.mean(axis=2)
                  gx=np.abs(np.diff(g,axis=1,prepend=g[:,:1]))
                  gy=np.abs(np.diff(g,axis=0,prepend=g[:1,:]))
                  qdetail.append(float((gx+gy).mean()))
              if min(qdetail)/max(qdetail) < 0.62: raise SystemExit(f'BROAD DETAIL IMBALANCE {name}: {qdetail}')
              g=arr.mean(axis=2)
              gx=np.abs(np.diff(g,axis=1,prepend=g[:,:1])); gy=np.abs(np.diff(g,axis=0,prepend=g[:1,:]))
              profile=(gx+gy).mean(axis=0)
              r=max(3,len(profile)//72)
              pad=np.r_[profile[-r:],profile,profile[:r]]
              smooth=np.convolve(pad,np.ones(2*r+1)/(2*r+1),mode='same')[r:-r]
              p10=float(np.percentile(smooth,10)); med=float(np.median(smooth))
              if p10/med < 0.78: raise SystemExit(f'LONGITUDE SOFTNESS FAIL {name}: p10/median={p10/med:.3f}')
              seam=float(np.abs(arr[:,0,:]-arr[:,-1,:]).mean())
              if seam > 20: raise SystemExit(f'SEAM FAIL {name}: {seam:.2f}')
              print(f'{name}: 2048x1024 clean JPEG, quarter-detail-ratio={min(qdetail)/max(qdetail):.3f}, p10/median={p10/med:.3f}, seam={seam:.2f}')
          print('Validated five distinct cleaned q18 sphere-ready textures.')
          PY
      - name: Run full integrity suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow numpy
          node tests/territory-cosmos-integrity.mjs
          node tests/family-home-integrity.mjs
          python tools/validate_territory_planets.py
      - name: Commit cleaned textures and remove one-time importer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-q18-clean-textures.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use cleaned 2048px q18 territory textures'
          git push origin HEAD:family-home-pilot
