name: Upgrade territory planet textures

on:
  push:
    branches: [family-home-pilot]
    paths:
      - 'tools/upgrade_territory_planets.py'
      - '.github/workflows/decode-territory-planet-textures.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: family-home-pilot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install imaging dependencies
        run: python -m pip install --quiet pillow numpy
      - name: Upgrade all five planet textures to matched 1536x768 assets
        run: python tools/upgrade_territory_planets.py
      - name: Validate 360-degree coverage and seams
        run: python tools/validate_territory_planets.py
      - name: Commit upgraded binary textures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/territory-planets/*.webp
          if git diff --cached --quiet; then
            echo 'Textures already upgraded.'
          else
            git commit -m 'Upgrade five territory planet textures to 1536'
            git push origin HEAD:family-home-pilot
          fi
