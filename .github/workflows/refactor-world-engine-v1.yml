name: Refactor planetary atlas to World Engine v1

on:
  push:
    branches: [family-home-pilot]
    paths:
      - '.github/workflows/refactor-world-engine-v1.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: family-home-pilot
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validation dependencies
        run: python -m pip install --quiet pillow numpy
      - name: Make renderer consume World Engine runtime config
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/territory-cosmos.js')
          s=p.read_text()
          start='import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";\n\nconst CORPUS_META={'
          marker='const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));'
          if start not in s or marker not in s:
              raise SystemExit('expected territory config block not found')
          a=s.index(start)
          b=s.index(marker)
          replacement='import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";\nimport {WORLD_META as CORPUS_META,WORLDS,MOBILE_POSITIONS} from "./world-runtime-config.js";\n\n'
          s=replacement+s[b:]
          p.write_text(s)
          PY
      - name: Extend main integrity workflow for engine files
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/family-home-integrity.yml')
          s=p.read_text()
          if "      - 'src/world-runtime-config.js'" not in s:
              s=s.replace("      - 'src/territory-cosmos.*'\n", "      - 'src/territory-cosmos.*'\n      - 'src/world-runtime-config.js'\n      - 'worlds/**'\n      - 'dreamscape-engine/**'\n")
          if "      - 'tests/world-engine-v1-integrity.mjs'" not in s:
              s=s.replace("      - 'tests/territory-cosmos-integrity.mjs'\n", "      - 'tests/territory-cosmos-integrity.mjs'\n      - 'tests/world-engine-v1-integrity.mjs'\n")
          if 'Run Dreamscape World Engine v1 integrity suite' not in s:
              s=s.replace("      - name: Validate five planet assets at full 360 degrees\n", "      - name: Run Dreamscape World Engine v1 integrity suite\n        run: node tests/world-engine-v1-integrity.mjs\n      - name: Validate five planet assets at full 360 degrees\n")
          p.write_text(s)
          PY
      - name: Run full integrity suite
        run: |
          node tests/family-home-integrity.mjs
          node tests/territory-cosmos-integrity.mjs
          node tests/world-engine-v1-integrity.mjs
          python tools/validate_territory_planets.py
      - name: Commit configuration-driven engine refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/refactor-world-engine-v1.yml
          git add src/territory-cosmos.js .github/workflows/family-home-integrity.yml .github/workflows/refactor-world-engine-v1.yml
          git commit -m 'Refactor planetary atlas onto World Engine v1 config'
          git push origin HEAD:family-home-pilot
