name: Refactor planetary atlas to World Engine v1

on:
  push:
    branches: [family-home-pilot]
    paths:
      - '.github/workflows/refactor-world-engine-v1.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: family-home-pilot
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validation dependencies
        run: python -m pip install --quiet pillow numpy
      - name: Make renderer consume World Engine runtime config
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/territory-cosmos.js')
          s=p.read_text()
          start='import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";\n\nconst CORPUS_META={'
          marker='const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));'
          if start not in s or marker not in s:
              raise SystemExit('expected territory config block not found')
          b=s.index(marker)
          replacement='import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";\nimport {WORLD_META as CORPUS_META,WORLDS,MOBILE_POSITIONS} from "./world-runtime-config.js";\n\n'
          p.write_text(replacement+s[b:])
          PY
      - name: Teach Family Home integrity test about config-driven territory data
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/family-home-integrity.mjs')
          s=p.read_text()
          if "const territoryConfigSource=read('src/world-runtime-config.js');" not in s:
              s=s.replace("const territorySource=read('src/territory-cosmos.js');\n", "const territorySource=read('src/territory-cosmos.js');\nconst territoryConfigSource=read('src/world-runtime-config.js');\n")
          old="for(const id of ['hearthlands','littoral','roadlands','institutional','river'])assert(territorySource.includes(`id:'${id}'`),`Territory selector is missing ${id}`);"
          new="for(const id of ['hearthlands','littoral','roadlands','institutional','river'])assert(territoryConfigSource.includes(`id:'${id}'`),`Territory selector config is missing ${id}`);"
          if old not in s:
              raise SystemExit('expected territory selector assertion not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Run full integrity suite
        run: |
          node tests/family-home-integrity.mjs
          node tests/territory-cosmos-integrity.mjs
          node tests/world-engine-v1-integrity.mjs
          python tools/validate_territory_planets.py
      - name: Commit configuration-driven engine refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/territory-cosmos.js tests/family-home-integrity.mjs
          git commit -m 'Refactor planetary atlas onto World Engine v1 config'
          git push origin HEAD:family-home-pilot
