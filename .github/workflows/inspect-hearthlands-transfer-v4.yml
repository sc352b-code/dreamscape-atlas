name: Inspect Hearthlands transfer API v4

on:
  push:
    paths:
      - '.github/workflows/inspect-hearthlands-transfer-v4.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect share module constants
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,re
          url='https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js'
          js=urllib.request.urlopen(url).read().decode('utf-8','ignore')
          for token in ['/shares/','File API returned','downloadUrl','download_url','api.firestorage','NEXT_PUBLIC','/api/']:
            print('\nTOKEN',token)
            for m in list(re.finditer(re.escape(token),js,re.I))[:8]:
              a=max(0,m.start()-2500); b=min(len(js),m.start()+3500)
              print(js[a:b])
              print('\n---END---')
          PY
