name: Rename reference world namespace

on:
  push:
    branches: [family-home-pilot]
    paths:
      - '.github/workflows/rename-reference-world.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: family-home-pilot
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rename world namespace and identifiers
        run: |
          mv worlds/natalie worlds/reference-world
          python - <<'PY'
          from pathlib import Path
          skip={'.git'}
          replacements=[
            ('worlds/natalie','worlds/reference-world'),
            ('natalie-dreamscape','dreamscape-reference-world'),
            ('Natalie’s','the reference corpus’s'),
            ("Natalie's","the reference corpus's"),
            ('Natalie','reference corpus'),
          ]
          for p in Path('.').rglob('*'):
            if not p.is_file() or '.git' in p.parts or p.suffix.lower() in {'.png','.jpg','.jpeg','.webp','.avif','.zip','.pdf'}:
              continue
            try: s=p.read_text()
            except UnicodeDecodeError: continue
            ns=s
            for a,b in replacements: ns=ns.replace(a,b)
            if ns!=s: p.write_text(ns)
          manifest=Path('worlds/reference-world/world-manifest.json')
          s=manifest.read_text().replace('"worldId": "natalie-dreamscape"','"worldId": "dreamscape-reference-world"')
          manifest.write_text(s)
          PY
      - name: Assert old identity is gone
        run: |
          if grep -Rni --exclude-dir=.git --exclude='rename-reference-world.yml' -E 'natalie|natalie-dreamscape|worlds/natalie' .; then
            echo 'Old misattributed identity remains' >&2
            exit 1
          fi
          test -f worlds/reference-world/world-manifest.json
          test -f worlds/reference-world/runtime-scene.json
          grep -q '"worldId": "dreamscape-reference-world"' worlds/reference-world/world-manifest.json
      - name: Run full integrity suite
        run: |
          python -m pip install --quiet pillow numpy
          node tests/family-home-integrity.mjs
          node tests/territory-cosmos-integrity.mjs
          node tests/world-engine-v1-integrity.mjs
          python tools/validate_territory_planets.py
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows/rename-reference-world.yml'
          git commit -m 'Correct reference world identity and namespace'
          git push origin HEAD:family-home-pilot
