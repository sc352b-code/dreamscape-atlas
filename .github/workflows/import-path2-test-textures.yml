name: Import Path 2 temporary globe textures
on:
  push:
    branches: [family-home-pilot]
    paths: ['.github/workflows/import-path2-test-textures.yml']
permissions:
  contents: write
jobs:
  import-path2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: family-home-pilot
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow numpy
      - name: Install Path 2 test textures and rewire renderer
        run: python tools/path2_import.py
      - name: Run full integrity suite
        run: |
          node tests/territory-cosmos-integrity.mjs
          node tests/family-home-integrity.mjs
          python tools/validate_territory_planets.py
      - name: Commit temporary Path 2 mount
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Mount Path 2 full-surface territory test textures'
          git push origin HEAD:family-home-pilot
